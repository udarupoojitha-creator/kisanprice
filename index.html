<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KisanPrice - Crop Prices and Weather for Farmers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="appName">KisanPrice</h1>
    <button id="langBtn" class="lang" aria-label="Change language">తెలుగు</button>
  </header>

  <main>
    <section class="weather" aria-live="polite">
      <label for="district" id="lblDistrict">District</label>
      <select id="district"></select>
      <p id="weatherText">Loading weather...</p>
      <p id="weatherAlert" class="alert" hidden></p>
    </section>

    <section>
      <div class="row">
        <h2 id="lblPrices">Today's mandi prices (per quintal)</h2>
        <label class="fav-only"><input type="checkbox" id="favOnly"> <span id="lblFavOnly">Favourites only</span></label>
      </div>
      <p id="alertBox" class="alert" hidden></p>
      <ul id="cropList" class="crops"></ul>
      <p class="note" id="lblNote">Prices shown are sample data for demo. Connect the Agmarknet API for live rates.</p>
    </section>

    <section id="detail" class="detail" hidden>
      <h2 id="detailName"></h2>
      <p id="detailPrice"></p>
      <canvas id="chart" width="600" height="220" aria-label="7 day price chart"></canvas>
      <div class="alert-set">
        <label for="target" id="lblTarget">Alert me when price reaches</label>
        <input type="number" id="target" min="0" step="10" placeholder="Rs">
        <button id="saveTarget">Set alert</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
